<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Absensi Pribadi</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0f13;
    --surface: #16181f;
    --surface2: #1e2029;
    --border: #2a2d3a;
    --accent: #5dffb0;
    --accent2: #ff6b6b;
    --accent3: #ffd166;
    --text: #e8eaf0;
    --text-muted: #6b7080;
    --radius: 16px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(93,255,176,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(93,255,176,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 480px;
    margin: 0 auto;
    padding: 24px 16px 40px;
    position: relative;
    z-index: 1;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 32px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }

  .header-left h1 {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--accent);
  }

  .header-left p {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .notif-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 16px;
    border-radius: 10px;
    font-family: 'Syne', sans-serif;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .notif-btn:hover { border-color: var(--accent); color: var(--accent); }
  .notif-btn.active { background: rgba(93,255,176,0.1); border-color: var(--accent); color: var(--accent); }

  /* Status Card */
  .status-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }

  .status-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), transparent);
  }

  .status-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .status-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .status-row:last-child { margin-bottom: 0; }

  .status-key {
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 600;
  }

  .status-val {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    font-weight: 500;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    font-family: 'DM Mono', monospace;
  }

  .badge-green { background: rgba(93,255,176,0.12); color: var(--accent); border: 1px solid rgba(93,255,176,0.2); }
  .badge-red { background: rgba(255,107,107,0.12); color: var(--accent2); border: 1px solid rgba(255,107,107,0.2); }
  .badge-yellow { background: rgba(255,209,102,0.12); color: var(--accent3); border: 1px solid rgba(255,209,102,0.2); }
  .badge-gray { background: rgba(107,112,128,0.12); color: var(--text-muted); border: 1px solid rgba(107,112,128,0.2); }

  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .dot.pulse { animation: pulse 1.5s infinite; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* Jadwal info */
  .schedule-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .schedule-icon {
    width: 40px;
    height: 40px;
    background: rgba(93,255,176,0.08);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }

  .schedule-info p {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .schedule-info strong {
    font-size: 14px;
    font-weight: 700;
  }

  /* Action buttons */
  .action-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
  }

  .section-title {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  .btn-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .btn {
    padding: 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .btn span.emoji { font-size: 20px; }
  .btn:hover { transform: translateY(-2px); }
  .btn-yes { border-color: rgba(93,255,176,0.3); }
  .btn-yes:hover { background: rgba(93,255,176,0.12); border-color: var(--accent); color: var(--accent); }
  .btn-no { border-color: rgba(255,107,107,0.3); }
  .btn-no:hover { background: rgba(255,107,107,0.12); border-color: var(--accent2); color: var(--accent2); }
  .btn-off { border-color: rgba(255,209,102,0.3); }
  .btn-off:hover { background: rgba(255,209,102,0.12); border-color: var(--accent3); color: var(--accent3); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  /* History */
  .history-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
  }

  .history-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }

  .clear-btn {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--accent2);
    background: none;
    border: none;
    cursor: pointer;
    opacity: 0.6;
    transition: opacity 0.2s;
  }

  .clear-btn:hover { opacity: 1; }

  .export-btn {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--accent);
    background: none;
    border: none;
    cursor: pointer;
    opacity: 0.7;
    transition: opacity 0.2s;
  }

  .export-btn:hover { opacity: 1; }

  .history-actions {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .history-list { display: flex; flex-direction: column; gap: 8px; }

  .history-item {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
    align-items: center;
    animation: slideIn 0.3s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .history-date {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 4px;
  }

  .history-detail {
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
  }

  .empty-state {
    text-align: center;
    padding: 24px;
    color: var(--text-muted);
    font-size: 13px;
  }

  .empty-state .emoji { font-size: 32px; display: block; margin-bottom: 8px; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 20px;
    font-size: 13px;
    font-weight: 600;
    z-index: 1000;
    transition: transform 0.3s ease;
    white-space: nowrap;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { border-color: rgba(93,255,176,0.3); color: var(--accent); }
  .toast.info { border-color: rgba(255,209,102,0.3); color: var(--accent3); }

  /* Popup overlay */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }

  .overlay.show { opacity: 1; pointer-events: all; }

  .popup {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px 24px;
    max-width: 320px;
    width: 100%;
    text-align: center;
    transform: scale(0.9);
    transition: transform 0.3s;
    position: relative;
    overflow: hidden;
  }

  .overlay.show .popup { transform: scale(1); }

  .popup::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent3));
  }

  .popup-emoji { font-size: 48px; margin-bottom: 16px; }
  .popup-title { font-size: 18px; font-weight: 800; margin-bottom: 8px; }
  .popup-subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 24px; line-height: 1.5; }

  .popup-buttons { display: flex; flex-direction: column; gap: 10px; }

  .popup-btn {
    padding: 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .popup-btn:hover { transform: translateY(-2px); }
  .popup-btn-yes { border-color: rgba(93,255,176,0.4); }
  .popup-btn-yes:hover { background: rgba(93,255,176,0.15); border-color: var(--accent); color: var(--accent); }
  .popup-btn-no { border-color: rgba(255,107,107,0.4); }
  .popup-btn-no:hover { background: rgba(255,107,107,0.15); border-color: var(--accent2); color: var(--accent2); }
  .popup-btn-off { border-color: rgba(255,209,102,0.4); }
  .popup-btn-off:hover { background: rgba(255,209,102,0.15); border-color: var(--accent3); color: var(--accent3); }

  /* Divider */
  .divider {
    height: 1px;
    background: var(--border);
    margin: 16px 0;
  }

  .time-display {
    font-family: 'DM Mono', monospace;
    font-size: 28px;
    font-weight: 500;
    color: var(--accent);
    text-align: center;
    letter-spacing: 2px;
    margin-bottom: 4px;
  }

  .date-display {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    text-align: center;
    margin-bottom: 16px;
  }

  .info-box {
    background: rgba(93,255,176,0.05);
    border: 1px solid rgba(93,255,176,0.1);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.5;
    margin-bottom: 16px;
  }

  .info-box strong { color: var(--accent); }
</style>
</head>
<body>

<div class="container">

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <h1>📋 Absensi</h1>
      <p id="currentDateHeader"></p>
    </div>
    <button class="notif-btn" id="notifBtn" onclick="requestNotifPermission()">
      🔔 Aktifkan Notif
    </button>
  </div>

  <!-- Clock -->
  <div class="time-display" id="clockDisplay">00:00:00</div>
  <div class="date-display" id="dateDisplay"></div>

  <!-- Info Jadwal -->
  <div class="info-box">
    Notif <strong>Pulang</strong>: Selasa jam <strong>15:30</strong> · Hari lain jam <strong>17:30</strong><br>
    Notif <strong>Datang</strong>: Setiap pagi jam <strong>07:00</strong>
  </div>

  <!-- Status Hari Ini -->
  <div class="status-card">
    <div class="status-label">STATUS HARI INI</div>
    <div class="status-row">
      <span class="status-key">Jam Datang</span>
      <span class="status-val" id="statusDatang">—</span>
    </div>
    <div class="status-row">
      <span class="status-key">Jam Pulang</span>
      <span class="status-val" id="statusPulang">—</span>
    </div>
    <div class="status-row">
      <span class="status-key">Status</span>
      <span id="statusBadge"><span class="badge badge-gray"><span class="dot"></span>Belum ada</span></span>
    </div>
  </div>

  <!-- Tombol Manual -->
  <div class="action-section">
    <div class="section-title">CATAT MANUAL</div>

    <div class="btn-group">
      <button class="btn btn-yes" onclick="showPopup('datang')">
        <span class="emoji">🏢</span>
        Sudah Datang
      </button>
      <button class="btn btn-yes" onclick="showPopup('pulang')">
        <span class="emoji">🏠</span>
        Mau Pulang
      </button>
    </div>

    <div style="margin-top:10px;">
      <button class="btn btn-off" style="width:100%;flex-direction:row;justify-content:center;" onclick="tandaiLibur()">
        <span class="emoji">🌴</span>
        Tandai Hari Ini Libur
      </button>
    </div>

    <div style="margin-top:10px;">
      <button class="btn btn-no" style="width:100%;flex-direction:row;justify-content:center;" onclick="tandaiBermalam()">
        <span class="emoji">🌙</span>
        Bermalam (Tidak Pulang)
      </button>
    </div>
  </div>

  <!-- Riwayat -->
  <div class="history-section">
    <div class="history-header">
      <div class="section-title" style="margin:0">RIWAYAT ABSENSI</div>
      <div class="history-actions">
        <button class="export-btn" onclick="exportCSV()">⬇ Export CSV</button>
        <button class="clear-btn" onclick="clearHistory()">Hapus Semua</button>
      </div>
    </div>
    <div class="history-list" id="historyList">
      <div class="empty-state"><span class="emoji">📭</span>Belum ada catatan</div>
    </div>
  </div>

</div>

<!-- Popup Overlay -->
<div class="overlay" id="popupOverlay">
  <div class="popup">
    <div class="popup-emoji" id="popupEmoji">❓</div>
    <div class="popup-title" id="popupTitle">Judul</div>
    <div class="popup-subtitle" id="popupSubtitle">Subjudul</div>
    <div class="popup-buttons" id="popupButtons"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// =====================
// STATE & STORAGE
// =====================

const STORAGE_KEY = 'absensi_data';

function getState() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
      records: [],          // array of daily records
      lastPopupDate: null,  // tanggal terakhir popup muncul
      bermalam: false,      // apakah sedang bermalam
      skipNextArrival: false, // skip notif datang esok
      waitingArrival: false,  // menunggu konfirmasi kedatangan
    };
  } catch(e) {
    return { records: [], lastPopupDate: null, bermalam: false, skipNextArrival: false, waitingArrival: false };
  }
}

function saveState(state) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function todayStr() {
  return new Date().toLocaleDateString('id-ID', { year:'numeric', month:'2-digit', day:'2-digit' });
}

function nowTimeStr() {
  return new Date().toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit' });
}

function getDayName() {
  const days = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
  return days[new Date().getDay()];
}

function getOrCreateTodayRecord(state) {
  const today = todayStr();
  let rec = state.records.find(r => r.date === today);
  if (!rec) {
    rec = { date: today, datang: null, pulang: null, status: 'kosong', bermalam: false };
    state.records.unshift(rec);
    // Keep max 60 records
    if (state.records.length > 60) state.records = state.records.slice(0, 60);
  }
  return rec;
}

// =====================
// CLOCK
// =====================

function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  const s = String(now.getSeconds()).padStart(2,'0');
  document.getElementById('clockDisplay').textContent = `${h}:${m}:${s}`;

  const opts = { weekday:'long', year:'numeric', month:'long', day:'numeric' };
  document.getElementById('dateDisplay').textContent = now.toLocaleDateString('id-ID', opts);
  document.getElementById('currentDateHeader').textContent = now.toLocaleDateString('id-ID', { day:'2-digit', month:'short', year:'numeric' });
}

setInterval(updateClock, 1000);
updateClock();

// =====================
// NOTIFICATION
// =====================

let notifGranted = false;
let schedulerInterval = null;

function requestNotifPermission() {
  if (!('Notification' in window)) {
    showToast('Browser tidak support notifikasi', 'info');
    return;
  }
  Notification.requestPermission().then(perm => {
    notifGranted = perm === 'granted';
    updateNotifBtn();
    if (notifGranted) {
      showToast('✅ Notifikasi aktif!', 'success');
      startScheduler();
    } else {
      showToast('Izin notifikasi ditolak', 'info');
    }
  });
}

function updateNotifBtn() {
  const btn = document.getElementById('notifBtn');
  if (notifGranted) {
    btn.textContent = '🔔 Notif Aktif';
    btn.classList.add('active');
  } else {
    btn.textContent = '🔔 Aktifkan Notif';
    btn.classList.remove('active');
  }
}

function sendNotification(title, body, type) {
  if (notifGranted) {
    const n = new Notification(title, { body, icon: '' });
    n.onclick = () => { window.focus(); showPopup(type); n.close(); };
  }
  // Juga tampilkan popup langsung
  showPopup(type);
}

// =====================
// SCHEDULER
// =====================

let lastCheckedMinute = -1;

function startScheduler() {
  if (schedulerInterval) clearInterval(schedulerInterval);
  schedulerInterval = setInterval(checkSchedule, 10000); // cek tiap 10 detik
  checkSchedule();
}

function getNotifPulangTime() {
  // Selasa = hari ke-2 (0=Minggu)
  return new Date().getDay() === 2 ? { h:15, m:30 } : { h:17, m:30 };
}

function checkSchedule() {
  const now = new Date();
  const h = now.getHours();
  const m = now.getMinutes();
  const currentMinute = h * 60 + m;
  const state = getState();
  const today = todayStr();
  const todayRec = state.records.find(r => r.date === today);

  // Guard: jangan trigger 2x dalam 1 menit
  if (currentMinute === lastCheckedMinute) return;

  // === NOTIF DATANG (07:00) ===
  if (h === 7 && m === 0) {
    lastCheckedMinute = currentMinute;
    // Skip jika bermalam kemarin
    if (state.skipNextArrival) {
      state.skipNextArrival = false;
      saveState(state);
      return;
    }
    // Skip jika sudah ada catatan datang hari ini
    if (todayRec && todayRec.datang) return;
    // Skip jika hari ini sudah libur
    if (todayRec && todayRec.status === 'libur') return;

    state.waitingArrival = true;
    saveState(state);
    sendNotification('🌅 Selamat Pagi!', 'Apakah kamu sudah sampai di tempat kerja?', 'datang');
    return;
  }

  // === NOTIF PULANG ===
  const pulangTime = getNotifPulangTime();
  if (h === pulangTime.h && m === pulangTime.m) {
    lastCheckedMinute = currentMinute;

    // Jika sudah catat pulang hari ini, skip
    if (todayRec && (todayRec.pulang || todayRec.bermalam)) return;
    // Jika libur, skip
    if (todayRec && todayRec.status === 'libur') return;

    sendNotification('🏠 Waktunya Pulang?', 'Apakah kamu pulang hari ini?', 'pulang');
    return;
  }

  // === AUTO LIBUR: jika jam notif pulang lewat tanpa ada catatan datang ===
  const pulangMinute = pulangTime.h * 60 + pulangTime.m;
  if (currentMinute > pulangMinute && !state.waitingArrival) {
    if (!todayRec || todayRec.status === 'kosong') {
      // Tidak ada catatan apapun hari ini → libur
      const s = getState();
      const rec = getOrCreateTodayRecord(s);
      if (rec.status === 'kosong') {
        rec.status = 'libur';
        saveState(s);
        renderStatus();
        renderHistory();
      }
    }
  }
}

// =====================
// POPUP
// =====================

function showPopup(type) {
  const overlay = document.getElementById('popupOverlay');
  const emoji = document.getElementById('popupEmoji');
  const title = document.getElementById('popupTitle');
  const subtitle = document.getElementById('popupSubtitle');
  const buttons = document.getElementById('popupButtons');

  buttons.innerHTML = '';

  if (type === 'pulang') {
    emoji.textContent = '🏠';
    title.textContent = 'Apakah kamu pulang hari ini?';
    subtitle.textContent = `Jam sekarang: ${nowTimeStr()} · ${getDayName()}, ${todayStr()}`;

    const btnYa = makePopupBtn('✅ Ya, saya pulang', 'popup-btn-yes', () => {
      catatPulang();
      closePopup();
    });
    const btnTidak = makePopupBtn('🌙 Tidak, saya bermalam', 'popup-btn-no', () => {
      catatBermalam();
      closePopup();
    });

    buttons.appendChild(btnYa);
    buttons.appendChild(btnTidak);

  } else if (type === 'datang') {
    emoji.textContent = '🌅';
    title.textContent = 'Apakah kamu sudah sampai?';
    subtitle.textContent = `Jam sekarang: ${nowTimeStr()} · ${getDayName()}, ${todayStr()}`;

    const btnYa = makePopupBtn('✅ Ya, sudah sampai', 'popup-btn-yes', () => {
      catatDatang();
      closePopup();
    });
    const btnLibur = makePopupBtn('🌴 Libur dulu', 'popup-btn-off', () => {
      tandaiLibur();
      closePopup();
    });

    buttons.appendChild(btnYa);
    buttons.appendChild(btnLibur);
  }

  overlay.classList.add('show');
}

function makePopupBtn(label, cls, fn) {
  const btn = document.createElement('button');
  btn.className = `popup-btn ${cls}`;
  btn.innerHTML = label;
  btn.onclick = fn;
  return btn;
}

function closePopup() {
  document.getElementById('popupOverlay').classList.remove('show');
}

// Tutup popup jika klik overlay
document.getElementById('popupOverlay').addEventListener('click', function(e) {
  if (e.target === this) closePopup();
});

// =====================
// CATAT ABSENSI
// =====================

function catatDatang() {
  const state = getState();
  const rec = getOrCreateTodayRecord(state);
  rec.datang = nowTimeStr();
  if (rec.status === 'kosong' || !rec.status) rec.status = 'hadir';
  state.waitingArrival = false;
  saveState(state);
  renderStatus();
  renderHistory();
  showToast(`✅ Jam datang dicatat: ${rec.datang}`, 'success');
}

function catatPulang() {
  const state = getState();
  const rec = getOrCreateTodayRecord(state);
  rec.pulang = nowTimeStr();
  if (!rec.datang) rec.datang = '—';
  rec.status = 'hadir';
  rec.bermalam = false;
  state.skipNextArrival = false;
  // esok akan ada notif datang, waitingArrival akan di-set oleh scheduler
  saveState(state);
  renderStatus();
  renderHistory();
  showToast(`✅ Jam pulang dicatat: ${rec.pulang}`, 'success');
}

function catatBermalam() {
  const state = getState();
  const rec = getOrCreateTodayRecord(state);
  rec.bermalam = true;
  rec.pulang = null;
  if (!rec.datang) rec.datang = '—';
  rec.status = 'bermalam';
  state.skipNextArrival = true; // skip notif datang esok
  saveState(state);
  renderStatus();
  renderHistory();
  showToast('🌙 Dicatat bermalam. Notif datang esok diskip.', 'info');
}

function tandaiLibur() {
  const state = getState();
  const rec = getOrCreateTodayRecord(state);
  rec.status = 'libur';
  rec.datang = null;
  rec.pulang = null;
  rec.bermalam = false;
  state.waitingArrival = false;
  saveState(state);
  renderStatus();
  renderHistory();
  showToast('🌴 Hari ini ditandai libur', 'info');
}

function tandaiBermalam() {
  const state = getState();
  const rec = getOrCreateTodayRecord(state);
  rec.bermalam = true;
  rec.status = 'bermalam';
  state.skipNextArrival = true;
  saveState(state);
  renderStatus();
  renderHistory();
  showToast('🌙 Bermalam dicatat. Notif datang esok diskip.', 'info');
}

// =====================
// RENDER
// =====================

function renderStatus() {
  const state = getState();
  const today = todayStr();
  const rec = state.records.find(r => r.date === today);

  document.getElementById('statusDatang').textContent = rec?.datang || '—';
  document.getElementById('statusPulang').textContent = rec?.pulang || (rec?.bermalam ? 'Bermalam 🌙' : '—');

  const badgeEl = document.getElementById('statusBadge');
  const status = rec?.status || 'kosong';

  const map = {
    hadir: `<span class="badge badge-green"><span class="dot pulse"></span>Hadir</span>`,
    libur: `<span class="badge badge-yellow"><span class="dot"></span>Libur</span>`,
    bermalam: `<span class="badge badge-red"><span class="dot"></span>Bermalam</span>`,
    kosong: `<span class="badge badge-gray"><span class="dot"></span>Belum ada</span>`,
  };

  badgeEl.innerHTML = map[status] || map['kosong'];
}

function renderHistory() {
  const state = getState();
  const list = document.getElementById('historyList');

  if (!state.records || state.records.length === 0) {
    list.innerHTML = `<div class="empty-state"><span class="emoji">📭</span>Belum ada catatan</div>`;
    return;
  }

  list.innerHTML = state.records.map(rec => {
    const statusMap = {
      hadir: { cls: 'badge-green', label: 'Hadir' },
      libur: { cls: 'badge-yellow', label: 'Libur' },
      bermalam: { cls: 'badge-red', label: 'Bermalam' },
      kosong: { cls: 'badge-gray', label: '—' },
    };
    const s = statusMap[rec.status] || statusMap['kosong'];

    let detail = '';
    if (rec.status === 'hadir') {
      detail = `Datang: ${rec.datang || '—'} · Pulang: ${rec.pulang || '—'}`;
    } else if (rec.status === 'bermalam') {
      detail = `Datang: ${rec.datang || '—'} · Bermalam 🌙`;
    } else if (rec.status === 'libur') {
      detail = 'Hari libur 🌴';
    } else {
      detail = 'Tidak ada catatan';
    }

    return `
      <div class="history-item">
        <div>
          <div class="history-date">${rec.date}</div>
          <div class="history-detail">${detail}</div>
        </div>
        <span class="badge ${s.cls}">${s.label}</span>
      </div>
    `;
  }).join('');
}

function clearHistory() {
  if (!confirm('Hapus semua riwayat absensi?')) return;
  const state = getState();
  state.records = [];
  saveState(state);
  renderStatus();
  renderHistory();
  showToast('🗑️ Riwayat dihapus', 'info');
}

// =====================
// TOAST
// =====================

let toastTimeout;
function showToast(msg, type='success') {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = `toast ${type} show`;
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => toast.classList.remove('show'), 3000);
}

// =====================
// EXPORT CSV
// =====================

function exportCSV() {
  const state = getState();

  if (!state.records || state.records.length === 0) {
    showToast('Belum ada data untuk diexport', 'info');
    return;
  }

  // Hitung durasi kerja
  function hitungDurasi(datang, pulang) {
    if (!datang || !pulang || datang === '—' || pulang === '—') return '—';
    try {
      const [dh, dm] = datang.split(':').map(Number);
      const [ph, pm] = pulang.split(':').map(Number);
      const totalMenit = (ph * 60 + pm) - (dh * 60 + dm);
      if (totalMenit <= 0) return '—';
      const jam = Math.floor(totalMenit / 60);
      const menit = totalMenit % 60;
      return `${jam}j ${menit}m`;
    } catch(e) { return '—'; }
  }

  const header = ['Tanggal', 'Hari', 'Jam Datang', 'Jam Pulang', 'Durasi', 'Status', 'Keterangan'];

  const hariMap = {
    '0': 'Minggu', '1': 'Senin', '2': 'Selasa',
    '3': 'Rabu', '4': 'Kamis', '5': 'Jumat', '6': 'Sabtu'
  };

  function getHari(dateStr) {
    try {
      // dateStr format: DD/MM/YYYY
      const parts = dateStr.split('/');
      const d = new Date(`${parts[2]}-${parts[1]}-${parts[0]}`);
      return hariMap[d.getDay()] || '—';
    } catch(e) { return '—'; }
  }

  function getKeterangan(rec) {
    if (rec.status === 'libur') return 'Hari Libur';
    if (rec.status === 'bermalam') return 'Tidak Pulang / Bermalam';
    if (rec.status === 'hadir') return 'Hadir Normal';
    return '—';
  }

  const rows = state.records.map(rec => {
    const durasi = hitungDurasi(rec.datang, rec.pulang);
    const statusLabel = {
      hadir: 'Hadir',
      libur: 'Libur',
      bermalam: 'Bermalam',
      kosong: '—'
    }[rec.status] || '—';

    return [
      rec.date,
      getHari(rec.date),
      rec.datang || '—',
      rec.pulang || (rec.bermalam ? 'Bermalam' : '—'),
      durasi,
      statusLabel,
      getKeterangan(rec)
    ].map(v => `"${v}"`).join(',');
  });

  // Summary baris
  const totalHadir = state.records.filter(r => r.status === 'hadir').length;
  const totalLibur = state.records.filter(r => r.status === 'libur').length;
  const totalBermalam = state.records.filter(r => r.status === 'bermalam').length;

  const csvContent = [
    `"REKAP ABSENSI PRIBADI"`,
    `"Diekspor pada: ${new Date().toLocaleString('id-ID')}"`,
    `""`,
    header.map(h => `"${h}"`).join(','),
    ...rows,
    `""`,
    `"RINGKASAN"`,
    `"Total Hadir","${totalHadir} hari"`,
    `"Total Libur","${totalLibur} hari"`,
    `"Total Bermalam","${totalBermalam} hari"`,
    `"Total Tercatat","${state.records.length} hari"`,
  ].join('\n');

  // Download
  const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const fileName = `absensi_${new Date().toLocaleDateString('id-ID').replace(/\//g,'-')}.csv`;
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  showToast(`📥 Tersimpan: ${fileName}`, 'success');
}

// =====================
// INIT
// =====================

function init() {
  // Cek permission notif
  if ('Notification' in window && Notification.permission === 'granted') {
    notifGranted = true;
    updateNotifBtn();
    startScheduler();
  }

  renderStatus();
  renderHistory();
}

init();
</script>
