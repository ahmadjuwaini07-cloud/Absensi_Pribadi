<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Absensi</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

/* ── TEMA ── */
:root {
  --bg:        #F5F5F7;
  --surface:   #FFFFFF;
  --border:    #E5E5EA;
  --text:      #1C1C1E;
  --text-2:    #6C6C70;
  --text-3:    #AEAEB2;
  --green:     #30D158;
  --green-bg:  #E8FAF0;
  --red:       #FF453A;
  --red-bg:    #FFEDEC;
  --yellow:    #FF9F0A;
  --yellow-bg: #FFF4E0;
  --blue:      #0A84FF;
  --blue-bg:   #E5F2FF;
  --radius:    16px;
  --radius-sm: 12px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg:        #000000;
    --surface:   #1C1C1E;
    --border:    #2C2C2E;
    --text:      #FFFFFF;
    --text-2:    #AEAEB2;
    --text-3:    #48484A;
    --green:     #30D158;
    --green-bg:  #0D2B18;
    --red:       #FF453A;
    --red-bg:    #2D1210;
    --yellow:    #FF9F0A;
    --yellow-bg: #2B1F00;
    --blue:      #0A84FF;
    --blue-bg:   #001F3D;
  }
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
  min-height: 100vh;
  font-size: 15px;
}

.page { max-width: 430px; margin: 0 auto; padding: 0 16px 56px; }

/* ── HEADER ── */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 0 10px;
  gap: 12px;
}

.header-left { min-width: 0; }
.header-title { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
.header-date  { font-size: 13px; color: var(--text-2); margin-top: 1px; }

.notif-pill {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 8px 14px;
  border-radius: 20px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  font-family: inherit;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-2);
  cursor: pointer;
  transition: all 0.18s;
  white-space: nowrap;
  flex-shrink: 0;
}
.notif-pill svg { width: 13px; height: 13px; }
.notif-pill.on  { border-color: var(--green); color: var(--green); background: var(--green-bg); }

/* ── CLOCK ── */
.clock-block {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 18px 20px;
  margin: 0 0 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.clock-time { font-size: 40px; font-weight: 700; letter-spacing: -2px; line-height: 1; font-variant-numeric: tabular-nums; }
.clock-right { text-align: right; }
.clock-day   { font-size: 14px; font-weight: 600; color: var(--text); }
.clock-date  { font-size: 12px; color: var(--text-2); margin-top: 2px; }

/* ── CARD ── */
.card {
  background: var(--surface);
  border-radius: var(--radius);
  margin-bottom: 10px;
  overflow: hidden;
}

.card-label {
  padding: 14px 16px 0;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: var(--text-3);
}

/* ── STATUS ── */
.row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
}
.row + .row { border-top: 1px solid var(--border); }
.row-key { font-size: 15px; font-weight: 500; }
.row-val { font-size: 15px; font-weight: 600; color: var(--text-2); font-variant-numeric: tabular-nums; }

.badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 10px; border-radius: 20px;
  font-size: 12px; font-weight: 700;
}
.dot { width:6px; height:6px; border-radius:50%; background:currentColor; }
.dot.pulse { animation: blink 1.6s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }

.bg { background: var(--green-bg);  color: var(--green); }
.br { background: var(--red-bg);    color: var(--red); }
.by { background: var(--yellow-bg); color: var(--yellow); }
.bn { background: var(--border);    color: var(--text-3); }

/* ── JADWAL ── */
.info-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 11px 16px; font-size: 14px;
}
.info-row + .info-row { border-top: 1px solid var(--border); }
.info-lbl { color: var(--text-2); }
.info-val { font-weight: 700; }

/* ── GRID AKSI ── */
.act-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  background: var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 10px;
}

.act {
  background: var(--surface);
  border: none;
  padding: 18px 10px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  transition: background 0.12s;
  font-family: inherit;
}
.act:active { background: var(--bg); }
.act.wide {
  grid-column: 1 / -1;
  flex-direction: row;
  padding: 15px 18px;
  gap: 12px;
}

.act-ico {
  width: 40px; height: 40px;
  border-radius: 11px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
}
.act.wide .act-ico { width: 34px; height: 34px; font-size: 17px; }

.act-txt { font-size: 12px; font-weight: 700; color: var(--text); text-align: center; line-height: 1.3; }
.act.wide .act-txt { font-size: 14px; text-align: left; }

.ic-b { background: var(--blue-bg); }
.ic-g { background: var(--green-bg); }
.ic-y { background: var(--yellow-bg); }
.ic-r { background: var(--red-bg); }

/* ── RIWAYAT ── */
.riwayat-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px 0;
}
.riwayat-acts { display: flex; gap: 14px; }

.link-btn {
  font-family: inherit;
  font-size: 12px; font-weight: 700;
  border: none; background: none; cursor: pointer;
  padding: 4px 0;
}
.lb-blue { color: var(--blue); }
.lb-red  { color: var(--red); opacity: .65; }
.lb-red:hover { opacity: 1; }

.hist-list { padding: 6px 0 4px; }

.hist-row {
  display: flex; align-items: center;
  padding: 11px 16px; gap: 12px;
}
.hist-row + .hist-row { border-top: 1px solid var(--border); }

.hist-ico {
  width: 36px; height: 36px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; flex-shrink: 0;
}

.hist-body { flex: 1; min-width: 0; }
.hist-date   { font-size: 12px; color: var(--text-3); margin-bottom: 2px; }
.hist-detail { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.empty {
  text-align: center; padding: 32px 16px;
  color: var(--text-3); font-size: 14px;
}
.empty span { font-size: 34px; display: block; margin-bottom: 8px; }

/* ── SHEET (bottom popup) ── */
.overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.4);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 100;
  display: flex; align-items: flex-end; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity .22s;
}
.overlay.show { opacity: 1; pointer-events: all; }

.sheet {
  background: var(--surface);
  width: 100%; max-width: 430px;
  border-radius: 24px 24px 0 0;
  padding: 0 20px 40px;
  transform: translateY(100%);
  transition: transform .28s cubic-bezier(.32,.72,0,1);
}
.overlay.show .sheet { transform: translateY(0); }

.sheet-handle {
  width: 36px; height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin: 10px auto 22px;
}

.sheet-emoji { font-size: 42px; display: block; text-align: center; margin-bottom: 10px; }
.sheet-title { font-size: 19px; font-weight: 700; text-align: center; margin-bottom: 5px; }
.sheet-sub   { font-size: 13px; color: var(--text-2); text-align: center; margin-bottom: 22px; line-height: 1.5; }

.s-btn {
  width: 100%; padding: 15px;
  border-radius: var(--radius-sm);
  border: none; font-family: inherit;
  font-size: 15px; font-weight: 700;
  cursor: pointer;
  margin-bottom: 8px;
  transition: opacity .12s;
  display: flex; align-items: center; justify-content: center; gap: 7px;
}
.s-btn:active { opacity: .75; }
.s-btn:last-child { margin-bottom: 0; }
.sb-g { background: var(--green);  color: #fff; }
.sb-r { background: var(--red);    color: #fff; }
.sb-y { background: var(--yellow); color: #fff; }
.sb-n { background: var(--border); color: var(--text-2); }

/* ── TOAST ── */
.toast {
  position: fixed; bottom: 28px; left: 50%;
  transform: translateX(-50%) translateY(72px);
  background: var(--text); color: var(--bg);
  padding: 11px 22px; border-radius: 24px;
  font-size: 13px; font-weight: 600;
  z-index: 200; white-space: nowrap;
  box-shadow: 0 4px 20px rgba(0,0,0,.18);
  transition: transform .26s cubic-bezier(.32,.72,0,1);
}
.toast.show { transform: translateX(-50%) translateY(0); }

</style>
</head>
<body>
<div class="page">

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="header-title">Absensi</div>
      <div class="header-date" id="hDate"></div>
    </div>
    <button class="notif-pill" id="notifBtn" onclick="reqNotif()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <span id="notifLbl">Aktifkan</span>
    </button>
  </div>

  <!-- Jam -->
  <div class="clock-block">
    <div class="clock-time" id="cTime">00:00</div>
    <div class="clock-right">
      <div class="clock-day" id="cDay"></div>
      <div class="clock-date" id="cDate"></div>
    </div>
  </div>

  <!-- Status -->
  <div class="card">
    <div class="card-label">Status Hari Ini</div>
    <div class="row"><span class="row-key">Jam Datang</span><span class="row-val" id="sDatang">—</span></div>
    <div class="row"><span class="row-key">Jam Pulang</span><span class="row-val" id="sPulang">—</span></div>
    <div class="row"><span class="row-key">Status</span><span id="sBadge"><span class="badge bn"><span class="dot"></span>Belum ada</span></span></div>
  </div>

  <!-- Jadwal -->
  <div class="card">
    <div class="card-label">Jadwal Notifikasi</div>
    <div class="info-row"><span class="info-lbl">Pulang — Selasa</span><span class="info-val">15.30</span></div>
    <div class="info-row"><span class="info-lbl">Pulang — Hari lain</span><span class="info-val">17.30</span></div>
    <div class="info-row"><span class="info-lbl">Datang — Setiap pagi</span><span class="info-val">07.00</span></div>
  </div>

  <!-- Aksi -->
  <div class="act-grid">
    <button class="act" onclick="showSheet('datang')">
      <div class="act-ico ic-b">🏢</div>
      <div class="act-txt">Sudah Datang</div>
    </button>
    <button class="act" onclick="showSheet('pulang')">
      <div class="act-ico ic-g">🏠</div>
      <div class="act-txt">Mau Pulang</div>
    </button>
    <button class="act wide" onclick="tandaiLibur()">
      <div class="act-ico ic-y">🌴</div>
      <div class="act-txt">Tandai Hari Ini Libur</div>
    </button>
    <button class="act wide" onclick="tandaiBermalam()">
      <div class="act-ico ic-r">🌙</div>
      <div class="act-txt">Bermalam / Tidak Pulang</div>
    </button>
  </div>

  <!-- Riwayat -->
  <div class="card">
    <div class="riwayat-head">
      <div class="card-label" style="padding:0">Riwayat</div>
      <div class="riwayat-acts">
        <button class="link-btn lb-blue" onclick="exportCSV()">↓ CSV</button>
        <button class="link-btn lb-red"  onclick="clearHistory()">Hapus</button>
      </div>
    </div>
    <div class="hist-list" id="histList">
      <div class="empty"><span>📭</span>Belum ada catatan</div>
    </div>
  </div>

</div>

<!-- Sheet -->
<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <span class="sheet-emoji" id="sEmoji"></span>
    <div class="sheet-title" id="sTitle"></div>
    <div class="sheet-sub"   id="sSub"></div>
    <div id="sBtns"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ── DATA ──
const KEY = 'absensi_v2';
function load()  { try { return JSON.parse(localStorage.getItem(KEY)) || base(); } catch{ return base(); } }
function base()  { return { records:[], skipNextArrival:false, waitingArrival:false }; }
function save(s) { localStorage.setItem(KEY, JSON.stringify(s)); }

function todayStr() {
  return new Date().toLocaleDateString('id-ID',{day:'2-digit',month:'2-digit',year:'numeric'});
}
function nowTime() {
  return new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
}
const DAYS = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
function dayName() { return DAYS[new Date().getDay()]; }

function getOrCreate(s) {
  const d = todayStr();
  let r = s.records.find(x => x.date === d);
  if (!r) {
    r = {date:d, datang:null, pulang:null, status:'kosong', bermalam:false};
    s.records.unshift(r);
    if (s.records.length > 60) s.records.length = 60;
  }
  return r;
}

// ── JAM ──
function tick() {
  const n = new Date();
  const hh = String(n.getHours()).padStart(2,'0');
  const mm = String(n.getMinutes()).padStart(2,'0');
  document.getElementById('cTime').textContent = `${hh}:${mm}`;
  document.getElementById('cDay').textContent  = dayName();
  document.getElementById('cDate').textContent = n.toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
  document.getElementById('hDate').textContent = n.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});
}
setInterval(tick, 1000); tick();

// ── NOTIF ──
let notifOn = false, schedTmr = null, lastMin = -1;

function reqNotif() {
  if (!('Notification' in window)) { toast('Browser tidak support notifikasi'); return; }
  Notification.requestPermission().then(p => {
    notifOn = p === 'granted';
    updNotif();
    if (notifOn) { toast('Notifikasi aktif ✓'); startSched(); }
    else toast('Izin notifikasi ditolak');
  });
}
function updNotif() {
  const b = document.getElementById('notifBtn');
  document.getElementById('notifLbl').textContent = notifOn ? 'Aktif' : 'Aktifkan';
  notifOn ? b.classList.add('on') : b.classList.remove('on');
}
function push(title, body, type) {
  if (notifOn) {
    const n = new Notification(title, {body});
    n.onclick = () => { window.focus(); showSheet(type); n.close(); };
  }
  showSheet(type);
}
function pulangJam() { return new Date().getDay()===2 ? {h:15,m:30} : {h:17,m:30}; }

function startSched() {
  if (schedTmr) clearInterval(schedTmr);
  schedTmr = setInterval(checkSched, 10000);
  checkSched();
}

function checkSched() {
  const n = new Date(), h = n.getHours(), m = n.getMinutes(), cur = h*60+m;
  if (cur === lastMin) return;
  const s = load();
  const today = todayStr();
  const rec = s.records.find(r => r.date === today);

  if (h===7 && m===0) {
    lastMin = cur;
    if (s.skipNextArrival) { s.skipNextArrival=false; save(s); return; }
    if (rec?.datang || rec?.status==='libur') return;
    s.waitingArrival=true; save(s);
    push('Selamat Pagi! 🌅','Apakah kamu sudah sampai di tempat kerja?','datang');
    return;
  }

  const pj = pulangJam();
  if (h===pj.h && m===pj.m) {
    lastMin = cur;
    if (rec?.pulang || rec?.bermalam || rec?.status==='libur') return;
    push('Waktunya Pulang? 🏠','Apakah kamu pulang hari ini?','pulang');
    return;
  }

  const pMin = pj.h*60+pj.m;
  if (cur>pMin && (!rec||rec.status==='kosong') && !s.waitingArrival) {
    const s2=load(), r2=getOrCreate(s2);
    if (r2.status==='kosong') { r2.status='libur'; save(s2); render(); }
  }
}

// ── SHEET ──
function showSheet(type) {
  document.getElementById('sBtns').innerHTML = '';
  if (type==='pulang') {
    document.getElementById('sEmoji').textContent = '🏠';
    document.getElementById('sTitle').textContent = 'Apakah kamu pulang hari ini?';
    document.getElementById('sSub').textContent   = `Sekarang ${nowTime()} · ${dayName()}`;
    addSBtn('✓  Ya, saya pulang','sb-g', ()=>{ catatPulang(); closeSheet(); });
    addSBtn('🌙  Tidak, saya bermalam','sb-r', ()=>{ catatBermalam(); closeSheet(); });
    addSBtn('Batal','sb-n', closeSheet);
  } else {
    document.getElementById('sEmoji').textContent = '🌅';
    document.getElementById('sTitle').textContent = 'Apakah kamu sudah sampai?';
    document.getElementById('sSub').textContent   = `Sekarang ${nowTime()} · ${dayName()}`;
    addSBtn('✓  Ya, sudah sampai','sb-g', ()=>{ catatDatang(); closeSheet(); });
    addSBtn('🌴  Libur dulu','sb-y', ()=>{ tandaiLibur(); closeSheet(); });
    addSBtn('Batal','sb-n', closeSheet);
  }
  document.getElementById('overlay').classList.add('show');
}
function addSBtn(txt, cls, fn) {
  const b = document.createElement('button');
  b.className = `s-btn ${cls}`; b.textContent = txt; b.onclick = fn;
  document.getElementById('sBtns').appendChild(b);
}
function closeSheet() { document.getElementById('overlay').classList.remove('show'); }
document.getElementById('overlay').addEventListener('click', e => { if(e.target===e.currentTarget) closeSheet(); });

// ── AKSI ──
function catatDatang() {
  const s=load(), r=getOrCreate(s);
  r.datang=nowTime(); if(!r.status||r.status==='kosong') r.status='hadir';
  s.waitingArrival=false; save(s); render();
  toast(`Jam datang: ${r.datang} ✓`);
}
function catatPulang() {
  const s=load(), r=getOrCreate(s);
  r.pulang=nowTime(); if(!r.datang) r.datang='—';
  r.status='hadir'; r.bermalam=false; s.skipNextArrival=false;
  save(s); render(); toast(`Jam pulang: ${r.pulang} ✓`);
}
function catatBermalam() {
  const s=load(), r=getOrCreate(s);
  r.bermalam=true; r.pulang=null; if(!r.datang) r.datang='—';
  r.status='bermalam'; s.skipNextArrival=true;
  save(s); render(); toast('Bermalam dicatat. Notif esok diskip 🌙');
}
function tandaiLibur() {
  const s=load(), r=getOrCreate(s);
  r.status='libur'; r.datang=null; r.pulang=null; r.bermalam=false;
  s.waitingArrival=false; save(s); render(); toast('Hari ini libur 🌴');
}
function tandaiBermalam() {
  const s=load(), r=getOrCreate(s);
  r.bermalam=true; r.status='bermalam'; s.skipNextArrival=true;
  save(s); render(); toast('Bermalam dicatat. Notif esok diskip 🌙');
}

// ── RENDER ──
function render() {
  const s = load();
  const rec = s.records.find(r => r.date===todayStr());

  document.getElementById('sDatang').textContent = rec?.datang||'—';
  document.getElementById('sPulang').textContent = rec?.pulang||(rec?.bermalam?'Bermalam 🌙':'—');

  const st = rec?.status||'kosong';
  const bm = {
    hadir:    `<span class="badge bg"><span class="dot pulse"></span>Hadir</span>`,
    libur:    `<span class="badge by"><span class="dot"></span>Libur</span>`,
    bermalam: `<span class="badge br"><span class="dot"></span>Bermalam</span>`,
    kosong:   `<span class="badge bn"><span class="dot"></span>Belum ada</span>`,
  };
  document.getElementById('sBadge').innerHTML = bm[st]||bm.kosong;

  const list = document.getElementById('histList');
  if (!s.records.length) {
    list.innerHTML = `<div class="empty"><span>📭</span>Belum ada catatan</div>`;
    return;
  }

  const icons  = { hadir:'✅', libur:'🌴', bermalam:'🌙', kosong:'❓' };
  const icoCls = { hadir:'ic-g', libur:'ic-y', bermalam:'ic-r', kosong:'' };
  const slabel = { hadir:'Hadir', libur:'Libur', bermalam:'Bermalam', kosong:'—' };
  const scls   = { hadir:'bg', libur:'by', bermalam:'br', kosong:'bn' };

  list.innerHTML = s.records.map(r => {
    let det = '';
    if (r.status==='hadir')    det = `Datang ${r.datang||'—'} · Pulang ${r.pulang||'—'}`;
    else if(r.status==='bermalam') det = `Datang ${r.datang||'—'} · Bermalam`;
    else if(r.status==='libur')    det = 'Hari libur';
    else det = 'Tidak ada catatan';

    return `<div class="hist-row">
      <div class="hist-ico ${icoCls[r.status]||''}">${icons[r.status]||'❓'}</div>
      <div class="hist-body">
        <div class="hist-date">${r.date}</div>
        <div class="hist-detail">${det}</div>
      </div>
      <span class="badge ${scls[r.status]||'bn'}">${slabel[r.status]||'—'}</span>
    </div>`;
  }).join('');
}

function clearHistory() {
  if (!confirm('Hapus semua riwayat?')) return;
  const s=load(); s.records=[]; save(s); render(); toast('Riwayat dihapus');
}

// ── EXPORT CSV ──
function exportCSV() {
  const s=load();
  if (!s.records.length) { toast('Belum ada data'); return; }

  function dur(d,p) {
    if(!d||!p||d==='—'||p==='—') return '—';
    try {
      const [dh,dm]=d.split(':').map(Number),[ph,pm]=p.split(':').map(Number);
      const t=(ph*60+pm)-(dh*60+dm);
      return t<=0?'—':`${Math.floor(t/60)}j ${t%60}m`;
    } catch{return '—';}
  }
  function getHari(ds) {
    try { const p=ds.split('/'); return DAYS[new Date(`${p[2]}-${p[1]}-${p[0]}`).getDay()]||'—'; }
    catch{return '—';}
  }

  const rows = s.records.map(r => [
    r.date, getHari(r.date),
    r.datang||'—',
    r.pulang||(r.bermalam?'Bermalam':'—'),
    dur(r.datang,r.pulang),
    {hadir:'Hadir',libur:'Libur',bermalam:'Bermalam',kosong:'—'}[r.status]||'—',
    {hadir:'Hadir Normal',libur:'Hari Libur',bermalam:'Tidak Pulang/Bermalam',kosong:'—'}[r.status]||'—',
  ].map(v=>`"${v}"`).join(','));

  const th=s.records.filter(r=>r.status==='hadir').length;
  const tl=s.records.filter(r=>r.status==='libur').length;
  const tb=s.records.filter(r=>r.status==='bermalam').length;

  const csv=[
    `"REKAP ABSENSI PRIBADI"`,
    `"Diekspor: ${new Date().toLocaleString('id-ID')}"`,
    `""`,
    `"Tanggal","Hari","Jam Datang","Jam Pulang","Durasi","Status","Keterangan"`,
    ...rows,
    `""`,
    `"Total Hadir","${th} hari"`,
    `"Total Libur","${tl} hari"`,
    `"Total Bermalam","${tb} hari"`,
    `"Total","${s.records.length} hari"`,
  ].join('\n');

  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`absensi_${new Date().toLocaleDateString('id-ID').replace(/\//g,'-')}.csv`;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
  toast('File CSV tersimpan ↓');
}

// ── TOAST ──
let tTmr;
function toast(msg) {
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(tTmr); tTmr=setTimeout(()=>el.classList.remove('show'),2800);
}

// ── INIT ──
if ('Notification' in window && Notification.permission==='granted') {
  notifOn=true; updNotif(); startSched();
}
render();
</script>
